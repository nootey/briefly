name: "Test"

on:
  push:
    paths-ignore:
      - '*.md'
      - 'data/**'
      - 'results/**'
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'data/**'
      - 'results/**'
    branches:
      - main
    types: [opened, synchronize]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run --group dev pytest
