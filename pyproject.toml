[project]
name = "briefly"
version = "0.2.0"
description = "Transcribe audio and summarize it. Stateless, configurable, nothing else."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "torch>=2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pre-commit>=4.0.0",
]

# faster-whisper runs on CTranslate2, not torch — torch is here for the cuBLAS and
# cuDNN shared libraries CTranslate2 loads at runtime, plus the VRAM reporting in
# main.py. PyPI's torch wheels are CPU-only on Windows, so pull it from PyTorch's
# own CUDA 12.8 index instead. Swap cu128 for cpu if you have no NVIDIA GPU.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
